<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Vaila OS Mobile</title>
    <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
    <div id="mobile-app">
        <header class="app-topbar">
            <div class="brand-lockup">
                <span id="connection-dot" class="connection-dot"></span>
                <div>
                    <p class="brand-kicker">Vaila OS</p>
                    <h1 id="mobile-view-title">Chat</h1>
                </div>
            </div>
            <div class="topbar-actions">
                <button id="token-btn" class="icon-button" type="button" aria-label="Access token">
                    <span aria-hidden="true">K</span>
                </button>
                <button id="refresh-btn" class="icon-button" type="button" aria-label="Refresh current view">
                    <span aria-hidden="true">R</span>
                </button>
            </div>
        </header>

        <main class="app-main">
            <section id="view-chat" class="mobile-view active" aria-label="Chat">
                <div class="status-grid">
                    <button id="gateway-card" class="status-card" type="button">
                        <span class="overline">Gateway</span>
                        <strong id="gateway-status">Checking</strong>
                    </button>
                    <button id="lens-card" class="status-card" type="button">
                        <span class="overline">Lens</span>
                        <strong id="active-persona-label">Proto Jane</strong>
                    </button>
                </div>

                <div id="persona-chips" class="chip-row" aria-label="Persona selector"></div>

                <div class="quick-actions" aria-label="Quick prompts">
                    <button type="button" data-prompt="Give me a concise system status check.">Status</button>
                    <button type="button" data-prompt="Help me plan the next useful Vaila OS improvement.">Plan</button>
                    <button type="button" data-prompt="Summarize the latest important activity in this system.">Summarize</button>
                </div>

                <div id="chat-feed" class="chat-feed">
                    <article class="message system">
                        <span class="message-label">System</span>
                        <div class="message-body">Mobile console online.</div>
                    </article>
                </div>

                <form id="chat-form" class="composer">
                    <textarea id="prompt-input" rows="1" placeholder="Message Vaila..."></textarea>
                    <button id="send-btn" class="send-button" type="submit" aria-label="Send prompt">Send</button>
                </form>
            </section>

            <section id="view-memory" class="mobile-view" aria-label="Memory">
                <div class="section-head">
                    <div>
                        <span class="overline">Review</span>
                        <h2>Memory</h2>
                    </div>
                    <div class="memory-counts">
                        <span id="durable-memory-count" class="count-pill">0 saved</span>
                        <span id="memory-count" class="count-pill">0 review</span>
                    </div>
                </div>
                <div class="memory-subhead">Saved Memories</div>
                <div id="durable-memory-list" class="card-stack compact-stack"></div>
                <div class="memory-subhead">Review Queue</div>
                <div id="memory-list" class="card-stack"></div>
            </section>

            <section id="view-files" class="mobile-view" aria-label="Files">
                <div class="section-head">
                    <div>
                        <span class="overline">Sandbox</span>
                        <h2>Workspace Files</h2>
                    </div>
                    <span id="files-count" class="count-pill">0</span>
                </div>
                <label class="upload-panel">
                    <input id="file-input" type="file">
                    <span class="upload-symbol">+</span>
                    <span>Upload to Vault</span>
                </label>
                <div id="files-list" class="card-stack"></div>
            </section>

            <section id="view-system" class="mobile-view" aria-label="System">
                <div class="section-head">
                    <div>
                        <span class="overline">Runtime</span>
                        <h2>System Health</h2>
                    </div>
                    <span id="health-count" class="count-pill">0</span>
                </div>
                <div id="system-list" class="card-stack"></div>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Mobile navigation">
            <button class="nav-button active" type="button" data-view="chat">
                <span class="nav-icon">C</span>
                <span>Chat</span>
            </button>
            <button class="nav-button" type="button" data-view="memory">
                <span class="nav-icon">M</span>
                <span>Memory</span>
            </button>
            <button class="nav-button" type="button" data-view="files">
                <span class="nav-icon">F</span>
                <span>Files</span>
            </button>
            <button class="nav-button" type="button" data-view="system">
                <span class="nav-icon">S</span>
                <span>System</span>
            </button>
        </nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="detail-dialog" class="detail-dialog">
        <div class="dialog-head">
            <h2 id="dialog-title">Details</h2>
            <button id="dialog-close" class="icon-button" type="button" aria-label="Close">X</button>
        </div>
        <div id="dialog-content" class="dialog-content"></div>
    </dialog>

    <script src="/static/mobile.js"></script>
</body>
</html>
